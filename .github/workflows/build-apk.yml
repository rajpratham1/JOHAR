name: Build Android APK

# Builds the JOHAR APK in the cloud — no local Android Studio needed.
# Trigger it three ways:
#   • push to main                → APK saved as a build artifact
#   • the "Run workflow" button    → same, on demand (Actions tab)
#   • push a tag like v1.0.0       → APK also attached to a GitHub Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a Release on tag builds

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1   # pinned for reproducible builds; matches intl ^0.20.3
          cache: true

      - name: Show Flutter version
        run: flutter --version

      # We keep the repo lean and don't commit the generated android/ folder.
      # This regenerates the Android platform files without touching lib/ or pubspec.yaml.
      - name: Generate Android platform files
        run: flutter create --platforms=android --org dev.johar --project-name johar .

      - name: Install dependencies
        run: flutter pub get

      # Generates lib/l10n/app_localizations*.dart from the .arb files.
      # (pub get also triggers this, but running it explicitly surfaces any
      # localization error clearly instead of burying it in the Gradle build.)
      - name: Generate localizations
        run: flutter gen-l10n

      # Some older Flutter plugins (e.g. flutter_tts) compile against a low Android
      # compileSdk (31) while their transitive AndroidX deps now require API 34+.
      # This Gradle init script raises compileSdk to 35 for library (plugin) modules
      # ONLY, leaving the app module at its Flutter-template default. Written in Groovy
      # so it works no matter whether Flutter generates Groovy or Kotlin build files,
      # and it survives the `flutter create` regeneration of the android/ folder.
      - name: Force plugin compileSdk (AAR metadata fix)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          F="$HOME/.gradle/init.d/johar-compile-sdk.gradle"
          {
            echo "allprojects {"
            echo "  afterEvaluate { project ->"
            echo "    if (project.plugins.hasPlugin('com.android.library')) {"
            echo "      try { project.android.compileSdk = 35 } catch (Exception e) { project.android.compileSdkVersion 35 }"
            echo "    }"
            echo "  }"
            echo "}"
          } > "$F"
          echo '----- wrote gradle init script -----'
          cat "$F"

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=JOHAR_WEB_BASE=${{ vars.JOHAR_WEB_BASE || 'https://johar.vercel.app' }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/johar.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: johar-apk
          path: app/build/app/outputs/flutter-apk/johar.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/johar.apk
