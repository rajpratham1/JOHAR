name: johar
description: "JOHAR — AR vocational safety training & blockchain-verified certification for Jharkhand's workers."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  http: ^1.2.0
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  flutter_tts: ^3.8.5

  # --- Enable these when wiring the full backend / AR (see ../README.md) ---
  # firebase_core: ^3.6.0
  # firebase_auth: ^5.3.1
  # cloud_firestore: ^5.4.4
  # ar_flutter_plugin: ^0.7.3      # markerless AR (ARCore) — see ar_view_screen.dart

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  generate: true            # enables gen-l10n (Hindi / Santali / English)
  uses-material-design: true
  assets:
    - assets/modules/
